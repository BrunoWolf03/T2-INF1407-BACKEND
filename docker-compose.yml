services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: nba_fantasy
    ports:
      - "5432:5432"

  api:
    build: ./api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
